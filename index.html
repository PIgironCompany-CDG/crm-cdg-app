<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM CDG</title>
<style>
  :root{--dark:#2b3138;--mid:#5c6672;--sand:#cbd3db;--light:#eef1f4;--bg:#f7f8fa;--line:#dde1e6;--blue:#26578a;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--dark);-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  #login h1{margin:0 0 4px;font-size:22px}
  #login p{margin:0 0 20px;color:var(--mid);font-size:14px}
  #login label{display:block;font-size:13px;color:var(--mid);margin:12px 0 6px}
  #login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px}
  #login button{width:100%;margin-top:20px;background:var(--dark);color:#fff;border:0;border-radius:9px;padding:13px;font-size:16px;font-weight:600}
  #loginErr{color:#b3261e;font-size:14px;margin-top:12px;min-height:18px}

  /* HEADER */
  header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sp{flex:1}
  header .who{font-size:12px;color:#cbd3db;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header button{background:#3a4450;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
  nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:52px;z-index:4}
  nav.tabs button{background:none;border:0;padding:12px 14px;font-size:14px;font-weight:600;color:var(--mid);border-bottom:2px solid transparent}
  nav.tabs button.on{color:var(--dark);border-bottom-color:var(--dark)}

  .bar{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
  .bar input,.bar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  .bar input[type=search]{flex:1;min-width:160px}
  .count{padding:10px 16px 0;font-size:13px;color:var(--mid)}

  /* LISTA CLIENTI — card responsive */
  .grid{padding:12px 16px 80px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .card:hover{border-color:var(--sand)}
  .card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .card .rag{font-weight:700;font-size:15px}
  .card .meta{color:var(--mid);font-size:12px;margin-top:2px}
  .card .row{margin-top:8px;font-size:13px}
  .card .row b{color:var(--mid);font-weight:600}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .t-caldo{background:#e2efda;color:#1f8a4c}.t-raffreddamento{background:#fff2cc;color:#8a6d00}
  .t-fermo{background:#f2f2f2;color:#666}.t-ex{background:#eee;color:#888}.t-prospect{background:#ddeeff;color:var(--blue)}
  .empty{padding:40px 16px;text-align:center;color:var(--mid)}

  /* DRAWER */
  .ov{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;z-index:8}
  .ov.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100vw);background:#fff;transform:translateX(100%);transition:transform .18s;overflow:auto;z-index:9}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{background:var(--dark);color:#fff;padding:16px 18px;position:sticky;top:0}
  .drawer .dh h2{margin:0;font-size:18px;padding-right:36px}
  .drawer .dh .sub{color:#cbd3db;font-size:13px;margin-top:4px}
  .drawer .close{position:absolute;top:12px;right:14px;background:transparent;border:0;color:#fff;font-size:26px;line-height:1}
  .sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mid)}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
  .kv .k{color:var(--mid)}
  #dash{padding:40px 16px;text-align:center;color:var(--mid)}

  @media (max-width:560px){
    .kv{grid-template-columns:120px 1fr}
    header .who{max-width:30vw}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="box" id="loginForm">
    <h1 id="ltitle">CRM CDG</h1>
    <p>Accesso riservato. Inserisci le tue credenziali.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Accedi</button>
    <div id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <h1 id="title">CRM CDG</h1>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button id="logout">Esci</button>
  </header>
  <nav class="tabs">
    <button data-tab="clienti" class="on">Clienti</button>
    <button data-tab="dash">Dashboard</button>
  </nav>

  <section id="tab-clienti">
    <div class="bar">
      <input type="search" id="q" placeholder="Cerca ragione sociale, comune, referente…">
      <select id="fSettore"><option value="">Tutti i settori</option></select>
      <select id="fStatus"><option value="">Tutti gli stati</option></select>
      <select id="fProv"><option value="">Tutte le province</option></select>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty">Nessun cliente corrisponde ai filtri.</div>
  </section>

  <section id="tab-dash" class="hidden">
    <div id="dash">Le dashboard (mercato, vendite, pipeline, magazzino) arrivano nel prossimo step.</div>
  </section>
</div>

<div class="ov" id="ov"></div>
<div class="drawer" id="drawer"></div>

<script src="config.js"></script>
<script>
const CFG = window.CRM_CONFIG;
document.getElementById('title').textContent = CFG.appTitle || "CRM";
document.getElementById('ltitle').textContent = CFG.appTitle || "CRM";
const API = CFG.workerBase.replace(/\/+$/,"");
let TOKEN = localStorage.getItem('crm_token') || "";
let DATA = [];

function esc(s){return (s==null?"":String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tclass(t){t=(t||"").toLowerCase();
  if(t.includes("caldo"))return"t-caldo";if(t.includes("raffred"))return"t-raffreddamento";
  if(t.includes("fermo"))return"t-fermo";if(t.includes("ex"))return"t-ex";if(t.includes("prospect"))return"t-prospect";return"";}

// ---------- auth ----------
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn'); const err=document.getElementById('loginErr');
  btn.disabled=true; btn.textContent="Accesso…"; err.textContent="";
  try{
    const r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password})});
    const j=await r.json();
    if(r.ok && j.token){ TOKEN=j.token; localStorage.setItem('crm_token',TOKEN); localStorage.setItem('crm_user',j.email||email); await start(); }
    else{ err.textContent = j.error==="credenziali non valide" ? "Email o password non corretti." : (j.error||"Accesso non riuscito."); }
  }catch(ex){ err.textContent="Errore di rete. Riprova."; }
  btn.disabled=false; btn.textContent="Accedi";
});
document.getElementById('logout').onclick=()=>{ localStorage.removeItem('crm_token'); localStorage.removeItem('crm_user'); location.reload(); };

async function loadData(){
  const r=await fetch(API+"/data",{headers:{"Authorization":"Bearer "+TOKEN}});
  if(r.status===401){ throw new Error("unauth"); }
  const j=await r.json();
  const snap=j.snapshot||{clienti:[]};
  const byCode={}; (snap.clienti||[]).forEach(c=>{ byCode[c.codice]=Object.assign({},c); });
  // overlay: applica le modifiche in coda (edits) sopra lo snapshot
  (j.edits||[]).forEach(ed=>{ if(ed && ed.codice && byCode[ed.codice]) Object.assign(byCode[ed.codice], ed.fields||{}); });
  DATA=Object.values(byCode);
  document.getElementById('who').textContent=j.user||localStorage.getItem('crm_user')||"";
}

// ---------- render ----------
function fillSelect(id,vals){const s=document.getElementById(id);
  s.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());
  [...new Set(vals.filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const fs=document.getElementById('fSettore').value,fst=document.getElementById('fStatus').value,fp=document.getElementById('fProv').value;
  const g=document.getElementById('grid'); g.innerHTML="";
  let n=0;
  DATA.filter(c=>{
    if(fs&&c.settore!==fs)return false; if(fst&&c.status!==fst)return false; if(fp&&c.provincia!==fp)return false;
    if(q){const b=((c.ragione||"")+" "+(c.comune||"")+" "+(c.referente||"")+" "+(c.codice||"")).toLowerCase(); if(!b.includes(q))return false;}
    return true;
  }).forEach(c=>{
    n++; const d=document.createElement('div'); d.className="card"; d.onclick=()=>openDrawer(c);
    d.innerHTML=`<div class="top"><div><div class="rag">${esc(c.ragione)}</div>
        <div class="meta">${esc(c.settore||"—")} · ${esc(c.comune||"")} ${c.provincia?"("+esc(c.provincia)+")":""}</div></div>
        <span class="tag ${tclass(c.tipologia)}">${esc(c.tipologia||"—")}</span></div>
      <div class="row"><b>Prossima azione:</b> ${esc(c.prossima_azione||"—")}</div>
      ${c.data_followup?`<div class="row"><b>Follow-up:</b> ${esc(c.data_followup)}</div>`:""}`;
    g.appendChild(d);
  });
  document.getElementById('count').textContent=`${n} clienti`;
  document.getElementById('empty').classList.toggle('hidden', n>0);
}

function openDrawer(c){
  const d=document.getElementById('drawer');
  const row=(k,v)=>`<div class="k">${k}</div><div>${esc(v||"—")}</div>`;
  d.innerHTML=`<div class="dh"><button class="close" onclick="closeDrawer()">×</button>
      <h2>${esc(c.ragione)}</h2><div class="sub">${esc(c.codice)} · ${esc(c.settore)} · ${esc(c.provincia)}</div></div>
    <div class="sec"><h3>Contatti</h3><div class="kv">
      ${row("Referente",c.referente)}${row("Email",c.email)}${row("Telefono",c.telefono)}${row("Proprietà",c.proprieta)}
      ${row("Comune",c.comune)}${row("Indirizzo",c.indirizzo)}</div></div>
    <div class="sec"><h3>Stato commerciale</h3><div class="kv">
      ${row("Tipologia",c.tipologia)}${row("Status",c.status)}${row("Priorità",c.priorita)}${row("Stato attività",c.stato_attivita)}
      ${row("Ultima azione",c.data_ultima_azione)}${row("Prossima azione",c.prossima_azione)}
      ${row("Follow-up",c.data_followup)}${row("Stato follow-up",c.stato_followup)}${row("Esito",c.esito)}</div></div>
    <div class="sec"><h3>Salute aziendale</h3><div class="kv">
      ${row("Ultimo bilancio",c.anno_bilancio)}${row("Fatturato bilancio",c.fatturato_bilancio)}${row("Utile/Perdita",c.utile)}
      ${row("Dipendenti",c.dipendenti)}${row("Rating",c.rating)}${row("Punteggio",c.punteggio)}${row("Limite credito",c.limite_credito)}</div></div>
    <div class="sec"><h3>Note</h3><div>${esc(c.note||"—")}</div></div>`;
  d.classList.add('open'); document.getElementById('ov').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('ov').classList.remove('open');}
document.getElementById('ov').onclick=closeDrawer;

// tabs
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('tab-clienti').classList.toggle('hidden', b.dataset.tab!=='clienti');
  document.getElementById('tab-dash').classList.toggle('hidden', b.dataset.tab!=='dash');
});
['q','fSettore','fStatus','fProv'].forEach(id=>document.getElementById(id).addEventListener('input',render));

async function start(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await loadData();
  fillSelect('fSettore',DATA.map(c=>c.settore));
  fillSelect('fStatus',DATA.map(c=>c.status));
  fillSelect('fProv',DATA.map(c=>c.provincia));
  render();
}

// avvio: se ho un token valido, entro; altrimenti login
(async ()=>{
  if(TOKEN){ try{ await start(); return; }catch(e){ localStorage.removeItem('crm_token'); } }
  document.getElementById('login').classList.remove('hidden');
})();
</script>
</body>
</html>
